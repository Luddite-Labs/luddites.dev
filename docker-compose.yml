services:
  web:
    build:
      context: .
      args:
        VITE_SITE_URL: https://ludditelabs.dev
        VITE_WEB3FORMS_ACCESS_KEY: ${VITE_WEB3FORMS_ACCESS_KEY:-}
        VITE_CONTACT_ENDPOINT: ${VITE_CONTACT_ENDPOINT:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - '8080:80'
    restart: unless-stopped
